name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # чтобы использовать Node.js 24 для actions
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin main
          # Ограничиваем размер диффа (GitHub Models имеет лимит контекста)
          DIFF=$(git diff origin/main...HEAD -- '*.java' | head -c 4000)
          
          # Экранируем спецсимволы для JSON
          ESCAPED_DIFF=$(echo "$DIFF" | jq -Rs .)
          
          echo "diff=$ESCAPED_DIFF" >> $GITHUB_OUTPUT

      - name: Call GitHub Models API
        id: ai_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Проверяем, есть ли что ревьювить
          if [ -z "${{ steps.diff.outputs.diff }}" ] || [ "${{ steps.diff.outputs.diff }}" = '""' ]; then
            echo "review=No Java files changed or diff is empty" >> $GITHUB_OUTPUT
            exit 0
          fi
            
          # Формируем JSON запрос через jq (безопасно)
          jq -n \
            --arg diff "${{ steps.diff.outputs.diff }}" \
            '{
              model: "gpt-4o-mini",
              messages: [
                {role: "system", content: "You are a strict senior Java code reviewer. Provide structured feedback with categories: 🔴 Critical, 🟡 Important, 🟢 Suggestion. Be concise."},
                {role: "user", content: ("Analyze this Java git diff and provide code review:\n\n" + $diff)}
              ],
              temperature: 0.2,
              max_tokens: 1000
            }' > request.json
            
          # Вызов GitHub Models API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://models.github.ai/inference/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -d @request.json 2>&1)
            
          # Получаем HTTP код и тело ответа
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            REVIEW=$(echo "$BODY" | jq -r '.choices[0].message.content // ""')
            echo "review=$REVIEW" >> $GITHUB_OUTPUT
          else
            echo "review=⚠️ AI Review failed with HTTP $HTTP_CODE. Make sure GitHub Models is enabled." >> $GITHUB_OUTPUT
            echo "Error details: $BODY"
          fi

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.ai_review.outputs.review }}`;
            
            // Проверяем, что ревью не пустое и не сообщение об ошибке
            if (review && review !== "null" && !review.startsWith("⚠️ AI Review failed")) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `🤖 **AI Code Review**\n\n${review}\n\n---\n*Powered by GitHub Models (gpt-4o-mini)*`
              });
            } else if (review.startsWith("⚠️ AI Review failed")) {
              // Опционально: создать комментарий с ошибкой для прозрачности
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `${review}\n\nПроверьте workflow в Actions для деталей.`
              });
            }