name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin main
          DIFF=$(git diff origin/main...HEAD | head -c 8000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Call local LLM via ngrok (no auth)
        id: review
        run: |
          RESPONSE=$(curl -s https://kristel-intergilt-gregorio.ngrok-free.dev:1234/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d @- <<'EOF'
              {
                "model": "deepseek-coder-6.7b-kexer",
                "messages": [
                  {
                    "role": "system",
                    "content": "You are a strict senior Java code reviewer."
                  },
                  {
                    "role": "user",
                    "content": "Analyze this Java git diff and provide structured review:\n\n${{ steps.diff.outputs.diff }}"
                  }
                ],
                "temperature": 0.1,
                "max_tokens": 1200
              }
              EOF
          )
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call local LLM (LM Studio)
        id: review
        run: |
          RESPONSE=$(curl https://kristel-intergilt-gregorio.ngrok-free.dev:1234/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"deepseek-coder-6.7b-instruct\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are a strict senior Java code reviewer.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Analyze this Java git diff and provide structured review with sections: Critical Issues, Bugs, Performance Issues, Code Smells, Suggestions.\n\n${{ steps.diff.outputs.diff }}\"
                }
              ],
              \"temperature\": 0.1,
              \"max_tokens\": 1200
            }")

          echo "$RESPONSE"

          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content')

          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.review }}`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🤖 AI Code Review:\n\n${review}`
            });
