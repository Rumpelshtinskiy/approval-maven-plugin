name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # чтобы использовать Node.js 24 для actions

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin main
          DIFF=$(git diff origin/main...HEAD -- '*.java' | head -c 3000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call OpenAI LLM
        id: ai_review
        run: |
          # Формируем JSON запрос в файл
          cat <<EOF > request.json
          {
            "model": "glm-5",
            "messages": [
              {"role": "system", "content": "You are a strict senior Java code reviewer."},
              {"role": "user", "content": "Analyze this Java git diff and provide structured review:\n\n${{ steps.diff.outputs.diff }}"}
            ],
            "temperature": 0.4,
            "max_tokens": 1200
          }
          EOF
  
          # Вызов облачной LLM через API ключ
          RESPONSE=$(curl -s https://ollama.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
          -d @request.json)
          
          echo "$RESPONSE"
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const review = `${{ steps.ai_review.outputs.review }}`;
            if (review && review !== "null") {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `🤖 AI Code Review:\n\n${review}`
              });
            }