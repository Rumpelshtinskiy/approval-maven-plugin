name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # чтобы использовать Node.js 24 для actions
permissions:
  contents: read
  issues: write
  pull-requests: write

