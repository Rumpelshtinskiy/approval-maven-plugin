      - name: Call Ollama (local LLM)
        id: ai_review
        run: |
          set +e
          
          DIFF='${{ steps.diff.outputs.diff }}'
          
          if [ -z "$DIFF" ] || [ "$DIFF" = '""' ]; then
            echo "review=No Java changes detected" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          REQUEST=$(jq -n \
            --arg diff "$DIFF" \
            '{
              model: "gpt-oss:120b-cloud",
              messages: [
                {
                  role: "system",
                  content: "You are a strict senior Java code reviewer. Always find bugs. If code has issues, mark them clearly as 🔴 Critical or 🟡 Important. Be concise."
                },
                {
                  role: "user",
                  content: ("Analyze this Java diff:\n\n" + $diff)
                }
              ],
              stream: false
            }')
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            http://localhost:11434/api/chat \
            -H "Content-Type: application/json" \
            -d "$REQUEST")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP: $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "review=⚠️ Ollama failed with HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            echo "Error: $BODY"
            exit 0
          fi
          
          REVIEW=$(echo "$BODY" | jq -r '.message.content // "No response"')
          
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai_review.outputs.review }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewRaw = process.env.REVIEW || "";
            const review = reviewRaw.replace(/```/g, "'''").replace(/`/g, "'");

            if (!review || review.includes("empty") || review.includes("no changes")) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: "⚠️ No meaningful diff found for review"
              });
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                "🤖 **AI Code Review**",
                "",
                review,
                "",
                "---",
                "*Powered by Ollama*"
              ].join("\n")
            });
